<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Shane McDermott — software, music, and creative work.">
    <title>Shane McDermott</title>

    <style>
        :root
        {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color-scheme: light;
        }

        *
        {
            box-sizing: border-box;
        }

        body
        {
            margin: 0;
            color: #181818;
            background: #fafafa;
            line-height: 1.6;
        }

        body.listening
        {
            overflow: hidden;
        }

        main
        {
            max-width: 850px;
            padding: 72px 24px 96px;
            margin: auto;
        }

        nav
        {
            display: flex;
            gap: 24px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 110px;
        }

        a
        {
            color: inherit;
            text-underline-offset: 4px;
        }

        nav a
        {
            text-decoration: none;
        }

        a:hover
        {
            color: #777;
        }

        h1
        {
            font-size: clamp(44px, 9vw, 82px);
            letter-spacing: -0.065em;
            line-height: 1.04;
            margin: 0 0 24px;
        }

        .intro
        {
            font-size: 21px;
            max-width: 610px;
            color: #555;
            margin-bottom: 110px;
        }

        h2
        {
            font-size: 27px;
            letter-spacing: -0.035em;
            margin: 0 0 28px;
        }

        section
        {
            margin-bottom: 90px;
        }

        .links
        {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        footer
        {
            color: #888;
            font-size: 14px;
        }

        button
        {
            font: inherit;
            cursor: pointer;
            background: transparent;
            border: 1px solid #bbb;
            border-radius: 30px;
            padding: 10px 24px;
        }

        button:disabled
        {
            opacity: 0.5;
            cursor: wait;
        }

        button:focus-visible,
        input:focus-visible
        {
            outline: 2px solid #a58aff;
            outline-offset: 5px;
        }

        .song
        {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .song + .song
        {
            margin-top: 28px;
        }

        .song small
        {
            display: block;
            color: #888;
        }

        #status
        {
            color: #777;
            font-size: 14px;
        }

        #experience
        {
            position: fixed;
            inset: 0;
            background: #050507;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s, visibility 1s;
            z-index: 5;
            color: #fff;
        }

        #experience.open
        {
            opacity: 1;
            visibility: visible;
        }

        canvas
        {
            width: 100%;
            height: 100%;
            display: block;
        }

        .caption
        {
            position: absolute;
            top: 28px;
            left: 28px;
            font-size: 12px;
            letter-spacing: 0.14em;
            color: #999;
        }

        .exit
        {
            position: absolute;
            top: 24px;
            right: 24px;
            color: #ccc;
            border-color: #444;
        }

        .controls
        {
            position: absolute;
            bottom: 24px;
            left: 24px;
            right: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            color: #bbb;
            font-size: 13px;
        }

        .controls button
        {
            color: #ddd;
            border-color: #444;
            padding: 7px 16px;
        }

        .controls label
        {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        #gentle
        {
            accent-color: #b2a4cd;
        }

        @media (max-width: 600px)
        {
            main
            {
                padding-top: 32px;
            }

            nav,
            .intro
            {
                margin-bottom: 85px;
            }

            .controls
            {
                left: 16px;
                right: 16px;
            }

            .caption
            {
                left: 20px;
            }

            .song
            {
                align-items: flex-start;
            }
        }

        @media (prefers-reduced-motion: reduce)
        {
            #experience
            {
                transition-duration: 0.2s;
            }
        }
    </style>
</head>

<body>
    <main id="portfolio">
        <nav aria-label="Main navigation">
            <a href="#music">Music</a>
            <a href="#contact">Contact</a>
            <a href="resume.pdf" download="Shane_McDermott_Resume.pdf">
                Resume
            </a>
        </nav>

        <header>
            <h1>Shane McDermott.</h1>
            <p class="intro">I am passionate about creating.</p>
        </header>

        <section id="music">
            <h2>Music</h2>

            <div class="song">
                <div>
                    Young Turks
                    <small>A living audiovisual composition</small>
                </div>

                <button
                    class="track-play"
                    type="button"
                    data-src="young-turks.m4a"
                    data-title="Young Turks"
                >
                    ▶ Play
                </button>
            </div>

            <div class="song">
                <div>
                    Palermo
                    <small>A living audiovisual composition</small>
                </div>

                <button
                    class="track-play"
                    type="button"
                    data-src="palermo.m4a"
                    data-title="Palermo"
                >
                    ▶ Play
                </button>
            </div>

            <p id="status" role="status"></p>
        </section>

        <section id="contact">
            <h2>Find me</h2>

            <div class="links">
                <a href="mailto:spmcder@gmail.com">Email ↗</a>

                <a
                    href="https://www.artstation.com/shanemcder"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    ArtStation ↗
                </a>

                <a
                    href="https://soundcloud.com/centurycentury"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    SoundCloud ↗
                </a>

                <a
                    href="https://github.com/shanemcder"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    GitHub ↗
                </a>
            </div>
        </section>

        <footer>© Shane McDermott</footer>
    </main>

    <div
        id="experience"
        role="dialog"
        aria-modal="true"
        aria-label="Audiovisual player"
        aria-hidden="true"
    >
        <canvas id="lights" aria-hidden="true"></canvas>

        <div class="caption">YOUNG TURKS</div>

        <button class="exit" id="exit" type="button">
            Exit ↗
        </button>

        <div class="controls">
            <button id="pause" type="button">Pause</button>

            <label>
                <input id="gentle" type="checkbox">
                Gentle visuals
            </label>
        </div>
    </div>

    <audio id="audio" preload="metadata"></audio>

    <script src="visualizer.js"></script>
</body>
</html>
